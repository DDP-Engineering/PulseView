# libsigrok was removed from this lock entirely on 2026-08-19. It is no
# longer a passive vendor dependency: the ATK DL16 and Hantek DSO-3062L
# drivers are developed directly in 05_Software/libsigrok as part of this
# repo's own history, not pulled from upstream. Listing it here with
# clone_enabled would let `--vendor` silently overwrite that work with
# pristine upstream source. If libsigrok's upstream is ever worth
# re-checking for a rebase, treat it as a fresh, deliberate review, not an
# automated vendor pull.
#
# All seven mirror-*.git repos on Gitea (the six below, plus mxe) were
# deleted the same day - a deliberate choice to keep this project to a
# single repo rather than maintain a set of mirrors nothing referenced
# anymore. What that costs: `mirror_upstreams.py --vendor` and `--push`
# no longer have anywhere to push to or extract from, so a future
# re-vendor of any of these needs `--clone` first (a fresh clone from
# canonical_url, i.e. GitHub) rather than pulling from an offline cache.
# The commit/licence data below stays as the provenance record of what
# is actually vendored into 05_Software/<name> right now.

