# Findings that affect the offline build, recorded 2026-08-17:
#
# 1. sigrok-util/cross-compile/msys2/sigrok-native-msys2 clones
#    git://github.com/dickens/libusb -b event-abstraction-v4. That branch NO
#    LONGER EXISTS - the repo is still there but the branch is gone. The
#    upstream script cannot run as written. Mainline libusb, already pinned
#    above, is the replacement.
# 2. The same script uses git://sigrok.org and git://github.com. The git://
#    protocol is disabled on GitHub; sigrok.org still serves it. Both were
#    moot while the Gitea mirrors existed; now that they are gone (see the
#    note above the source list), a re-vendor talks to GitHub over https,
#    same as everything else that clones from canonical_url.
# 3. git://sigrok.org/libsigrok HEAD equals the pinned commit 0bc2487778e6, so
#    sigrok.org is the canonical origin and GitHub is itself a mirror.
