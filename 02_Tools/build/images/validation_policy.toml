schema = 1

[[policy]]
image = "mingw"
architecture = "amd64"
mandatory_tests = [
  "windows-python",
  "networking-stack",
  "pe-import-closure",
]

[[policy]]
image = "appimage"
architecture = "amd64"
mandatory_tests = [
  "appimage-identity",
  "appimage-runtime",
  "appimage-gui-startup",
]

[[policy]]
image = "appimage"
architecture = "arm64"
mandatory_tests = [
  "appimage-identity",
  "appimage-runtime",
  "deb-metadata",
]
