schema = 1

id = "REQ-PLAT-c4b846a8"

title = "Document the supported Windows route and each build path network boundary"

status = "active"

requirement = """
The build environment documentation shall present WSL2 with Docker Engine
installed inside the Linux distribution as the preferred Windows route, and
shall state for each build path whether it requires network access, without
claiming that a path needs none when it installs packages at build time.
"""

verification = """
Inspection: read Environment_Setup.md, 02_Tools/build/README.md,
02_Tools/build/images/README.md, 02_Tools/bootstrap/README.md and
07_Delivery/toolchain/README.md. Confirm a step-by-step Docker Engine in WSL2
procedure exists and Docker Desktop is offered only as an alternative; confirm no
statement claims normal builds need no network while build_linux.sh runs apt;
confirm no documented build argument, architecture limit, or planned tool
contradicts the current scripts.
"""

affected_paths = [
    "README.md",
    "01_Documentation/Environment_Setup.md",
    "01_Documentation/Testing.md",
    "02_Tools/bootstrap/README.md",
    "02_Tools/bootstrap/check_host.sh",
    "02_Tools/build/README.md",
    "02_Tools/build/STATUS.md",
    "02_Tools/build/build_appimage.sh",
    "02_Tools/build/build_windows_mxe.sh",
    "02_Tools/build/images/README.md",
    "02_Tools/build/load_image.sh",
    "02_Tools/build/package_windows.sh",
    "02_Tools/test/shell_invocation_contract_test.sh",
    "07_Delivery/toolchain/README.md",
]

linked_tests = [
    "02_Tools/test/shell_invocation_contract_test.sh",
]

spec = ""

priority = "normal"
rationale = """
Environment_Setup.md offered Docker Desktop with no Docker Engine procedure,
02_Tools/build/README.md claimed normal builds reach no network while
build_linux.sh ran apt on every build, and images/README.md documented an
argument the Dockerfile no longer has.
"""

