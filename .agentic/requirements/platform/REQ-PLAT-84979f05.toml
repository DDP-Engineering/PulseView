# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-PLAT-84979f05"

title = "Load decoders written in modern Python on Windows"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
When a protocol decoder written with Python syntax that a 3.4 interpreter cannot parse - a formatted string literal, a variable annotation, or a dataclass - is installed in the Windows x86_64 build's decoder directory, that build shall load the decoder and list it among the decoders it offers.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
#
# Some behaviors no test can settle: a look-and-see judgement, an install
# on clean hardware, a printed page. Start this field with "Manual:" or
# "Inspection:" and name the method, and `check` records the requirement
# as verified by hand instead of counting it among the tests still owed.
# The prefix alone is not enough — it has to say what someone does.
verification = "Run 02_Tools/test/windows_python_smoke.sh against a staged Windows tree, on Windows or under Wine. It writes a throwaway decoder using a formatted string literal, a variable annotation, enum.IntFlag and a dataclass into the staged decoder directory, runs sigrok-cli.exe -L, and fails unless that decoder appears in the listing; it then removes it and fails unless the listing returns to its baseline. It also fails if any installed decoder directory other than the shared common helper package is missing from the listing, naming the ones that are. That set comparison is what catches the real hazard, because libsigrokdecode discards decoder load errors and a decoder the interpreter cannot parse is simply absent from the list with no diagnostic anywhere."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
    "02_Tools/build/build_windows_mxe.sh",
    "02_Tools/build/images/Dockerfile.mingw",
    "02_Tools/test/windows_python_smoke.sh",
    "02_Tools/test/run_tests.sh",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
    "02_Tools/test/windows_python_smoke.sh::embedded_python_is_3_9_or_newer",
    "02_Tools/test/windows_python_smoke.sh::all_installed_decoders_are_listed",
    "02_Tools/test/windows_python_smoke.sh::post_3_4_syntax_decoder_loads",
    "02_Tools/test/windows_python_smoke.sh::listing_returns_to_baseline",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "high"   # low | normal | high
rationale = "The Linux and AppImage builds use the distribution's python3, so a Windows build stuck on an older interpreter silently drops any decoder it cannot parse while the same decoder works everywhere else. That platform split is expensive to diagnose precisely because it is silent, and it blocks importing decoders that use post-3.4 syntax. Satisfying this needs an embedded interpreter no older than 3.9; the build uses CPython 3.13, which also exceeds the 3.10 and 3.12 interpreters the Linux deliveries run against."

created = 2026-08-23
updated = 2026-08-23
