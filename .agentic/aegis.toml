# Project-owned AEGIS configuration for the 2026 PulseView project (Hantek
# DSO3062L / ATK DL16 integration).
# AEGIS is advisory; this file does not grant Git, driver, hardware, or
# publication authority.

schema = 1

[commands]
# 02_Tools/test now exists, so this is a real command rather than a
# placeholder. It runs every test in that directory and reports pass, fail
# and skip separately.
#
# Skips are load-bearing here and are not treated as passes: these tests drive
# built artifacts, so windows_python_smoke.sh needs a staged Windows tree and
# either a Windows host or Wine. On a host with neither it exits 77 and the
# runner reports it as skipped; a run in which nothing at all executed exits
# 77 itself rather than claiming a green suite.
test = "bash 02_Tools/test/run_tests.sh"

[timeouts]
# Add limits together with real commands. A stopped command proves nothing.

[layout]
default_branch = "master"
source = [
    "02_Tools/",
    "05_Software/",
]
tests = [
    "02_Tools/test/",
    "02_Tools/tests/",
    "05_Software/**/test/**",
    "05_Software/**/tests/**",
]
# Planning, documentation, hardware evidence, and delivery records are
# intentionally outside source/tests. An outside-layout finding for those paths
# is a review prompt, not a reason to classify documentation as executable
# source and demand irrelevant test changes.

[zones]
frame = []
specify = []
design = []
survey = []
components = ["tests"]
close = []

[check]
secret_patterns_extra = []
# Two distinct findings live here, both promoted by `strict_promote` below and
# neither an actual secret. They are listed file by file rather than by a glob
# over the vendored trees, because `ignore` is read by every diff check, not
# only the secret scan: an ignored path also drops out of `uncovered-source`
# and `scope-drift`. That is acceptable for the three entries below and would
# not be for a whole directory of third-party code, which is exactly where a
# secret scan earns its keep.
ignore = [
    # A coverage gap, not a match. `added_lines_of` refuses to read an
    # untracked file over MAX_SCAN_BYTES (256 KiB), and a task's generated
    # anchor exceeds that once the tree is large enough - TASK-2898e9a7's is
    # 380 KiB where TASK-4459b9f5's is 21 KiB, which is the whole reason only
    # one of the two ever produced this finding. The content is AEGIS's own
    # state: repo-relative paths and sha256 digests, nothing else.
    ".agentic/tasks/*.anchor.json",
    # Real content, wrong conclusion. Both are upstream sigrok RFID decoders
    # for tags whose protocol has a literal password field, so the word is
    # protocol vocabulary in a decoder table. Vendored code, unmodified here.
    "05_Software/libsigrokdecode/decoders/em4305/pd.py",
    "05_Software/libsigrokdecode/decoders/t55xx/pd.py",
]
strict_promote = [
    "config",
    "secret-in-diff",
]
# Populate this only when executable commands exist. Listing a command here
# controls `aegis check --run`; it does not create the command.
run = []
