# Project-owned AEGIS configuration for the 2026 PulseView project (Hantek
# DSO3062L / ATK DL16 integration).
# AEGIS is advisory; this file does not grant Git, driver, hardware, or
# publication authority.

schema = 1

[commands]
# 02_Tools/test now exists, so this is a real command rather than a
# placeholder. It runs every test in that directory and reports pass, fail
# and skip separately.
#
# Skips are load-bearing here and are not treated as passes: these tests drive
# built artifacts, so windows_python_smoke.sh needs a staged Windows tree and
# either a Windows host or Wine. On a host with neither it exits 77 and the
# runner reports it as skipped; a run in which nothing at all executed exits
# 77 itself rather than claiming a green suite.
test = "bash 02_Tools/test/run_tests.sh"

[timeouts]
# Add limits together with real commands. A stopped command proves nothing.

[layout]
default_branch = "master"
source = [
    "02_Tools/",
    "05_Software/",
]
tests = [
    "02_Tools/test/",
    "02_Tools/tests/",
    "05_Software/**/test/**",
    "05_Software/**/tests/**",
]
# Planning, documentation, hardware evidence, and delivery records are
# intentionally outside source/tests. An outside-layout finding for those paths
# is a review prompt, not a reason to classify documentation as executable
# source and demand irrelevant test changes.

[zones]
frame = []
specify = []
design = []
survey = []
components = ["tests"]
close = []

[check]
secret_patterns_extra = []
ignore = []
strict_promote = [
    "config",
    "secret-in-diff",
]
# Populate this only when executable commands exist. Listing a command here
# controls `aegis check --run`; it does not create the command.
run = []
